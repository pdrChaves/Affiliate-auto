services:
  promo-radar:
    build: .
    env_file: .env
    environment:
      HOST: 0.0.0.0          # dentro do container; a porta abaixo só é publicada para esta máquina
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/app/data
      - ./config:/app/config:ro
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
