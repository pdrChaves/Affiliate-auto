# ============================================================================
#  Configuração única do Promo Radar (não existe mais "nicho").
#  Você pesquisa na barra do painel — ex.: "teclado", "mochila" — e escolhe o
#  que vai para a fila. Buscas salvas rodam sozinhas de tempos em tempos.
#
#  Os filtros usam os 19 DEPARTAMENTOS do menu "Comprar por categoria" do
#  amazon.com.br. O departamento de cada produto vem da própria Amazon
#  (browseNodeInfo), não da caixa de seleção da busca.
#  Veja a lista com:  python -m app.cli categorias
# ============================================================================

# Regras para uma oferta virar post (valem para toda busca)
filters:
  min_discount_pct: 20         # desconto mínimo informado pela Amazon
  min_price: 30.00
  max_price: 5000.00
  require_buybox: true         # só a oferta que o cliente vê ao clicar
  accept_list_price: true      # aceitar "De" de tabela (entra com aviso); false recusa
  cooldown_hours: 72           # não repetir o mesmo produto antes disso
  repost_if_drop_pct: 5        # ...a menos que caia mais esse tanto
  max_posts_per_search: 5      # quantos posts uma busca pode enfileirar por rodada
  posting_window: ["08:00", "22:30"]   # janela em que os avisos são enviados
  saved_search_every_minutes: 60       # de quanto em quanto tempo as buscas salvas rodam

# Estilo do post
style:
  emoji_price: "🔥"
  whatsapp_target: ""          # rótulo da comunidade, só para lembrar você onde enviar
  headline_fallbacks:          # chamadas usadas quando não há IA configurada
    - "ACHADO DO DIA"
    - "PREÇO BOM DEMAIS PRA PASSAR"
    - "ISSO AQUI VALE O CLIQUE"
    - "GARIMPO DE HOJE"
  tone: "direto, honesto, fala do uso no dia a dia"
