# ============================================================================
#  Um bloco por comunidade. Cada busca fica dentro de uma CATEGORIA da Amazon
#  (search_index) — a mesma taxonomia do site, então o que você configura aqui
#  corresponde ao que você encontra pesquisando no amazon.com.br.
#
#  Categorias válidas no amazon.com.br (10, e só estas):
#    All                      Todos os departamentos
#    Books                    Livros
#    Computers                Computadores e Informática
#    Electronics              Eletrônicos
#    HomeAndKitchen           Casa e Cozinha
#    KindleStore              Loja Kindle
#    MobileApps               Apps e Jogos
#    OfficeProducts           Material para Escritório e Papelaria
#    ToolsAndHomeImprovement  Ferramentas e Materiais de Construção
#    VideoGames               Games
#
#  Ver no terminal:  python -m app.cli categorias
#
#  Não existem em BR: Fashion, Toys, HealthPersonalCare, SportsAndOutdoors,
#  Beauty, PetSupplies e afins. Para esses assuntos (moda, brinquedos, LEGO,
#  suplementos…) use `search_index: All` com palavras-chave, ou um BROWSE NODE.
#
#  BROWSE NODE = subcategoria exata. Abra a categoria no amazon.com.br e copie
#  o número que aparece em "node=" na URL. Exemplo:
#    https://www.amazon.com.br/s?i=toys&rh=n%3A16333486011  →  16333486011
#  Ele exige uma categoria específica em search_index (não pode ser "All").
#
#  Cada busca precisa de keywords OU browse_node_id (só a categoria não basta).
# ============================================================================

niches:
  - id: eletronicos
    name: "Eletrônicos"
    whatsapp_target: "COMUNIDADE - Eletrônicos"   # rótulo para você saber onde enviar
    enabled: true
    collect_every_minutes: 60
    min_discount_pct: 25
    min_price: 50.00
    max_price: 3000.00
    require_buybox: true
    accept_list_price: true        # aceitar "De" que é preço de tabela (entra com aviso)
    cooldown_hours: 72             # não repetir o mesmo produto antes disso
    repost_if_drop_pct: 5          # ...a menos que caia mais esse tanto
    max_posts_per_run: 5
    posting_window: ["08:00", "22:30"]
    searches:
      - { search_index: Electronics, keywords: "fone de ouvido bluetooth" }
      - { search_index: Electronics, keywords: "smartwatch" }
      - { search_index: Electronics, keywords: "caixa de som bluetooth" }
      # - { search_index: Electronics, browse_node_id: "16364755011" }   # subcategoria específica
    watchlist: []
    style:
      emoji_price: "🔥"
      headline_fallbacks:
        - "ACHADO DE TECNOLOGIA"
        - "PREÇO BOM DEMAIS PRA PASSAR"
        - "ISSO AQUI VALE O CLIQUE"
      tone: "direto, prático, fala do uso no dia a dia"

  - id: games
    name: "Games"
    whatsapp_target: "COMUNIDADE - Games"
    enabled: true
    collect_every_minutes: 90
    min_discount_pct: 20
    min_price: 40.00
    max_price: 5000.00
    require_buybox: true
    accept_list_price: true
    cooldown_hours: 96
    repost_if_drop_pct: 5
    max_posts_per_run: 4
    posting_window: ["09:00", "23:00"]
    searches:
      - { search_index: VideoGames, keywords: "headset gamer" }
      - { search_index: VideoGames, keywords: "controle sem fio" }
      - { search_index: Computers, keywords: "teclado mecânico" }
    watchlist: []
    style:
      emoji_price: "🎮"
      headline_fallbacks:
        - "UPGRADE NO SETUP"
        - "GARIMPO DO DIA"
        - "ESSE ENTRA NA LISTA"
      tone: "gamer, empolgado mas honesto"

  - id: casa
    name: "Casa e Cozinha"
    whatsapp_target: "COMUNIDADE - Casa"
    enabled: false                 # exemplo desligado: ligue quando quiser usar
    collect_every_minutes: 120
    min_discount_pct: 30
    min_price: 40.00
    max_price: 2000.00
    require_buybox: true
    accept_list_price: false       # aqui o "De" de tabela é recusado, não só avisado
    cooldown_hours: 96
    repost_if_drop_pct: 5
    max_posts_per_run: 3
    posting_window: ["09:00", "21:00"]
    searches:
      - { search_index: HomeAndKitchen, keywords: "air fryer" }
      - { search_index: HomeAndKitchen, keywords: "robô aspirador" }
    watchlist: []
    style:
      emoji_price: "🏠"
      headline_fallbacks:
        - "PRA CASA FICAR MELHOR"
        - "ACHADO PRA COZINHA"
      tone: "prático, foca no que resolve na rotina"
