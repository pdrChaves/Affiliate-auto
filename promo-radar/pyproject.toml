[tool.ruff]
line-length = 120
target-version = "py311"
exclude = ["qa"]   # scripts da bateria de avaliação, escritos para rodar à mão

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "SIM", "S", "C90", "N"]
ignore = [
  "S311",   # random só no catálogo simulado
  "B008",   # Depends()/Form() em parâmetros é o padrão do FastAPI
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "E501"]   # assert e senhas fictícias em testes
# update_post: nomes de coluna vêm da whitelist UPDATABLE; valores sempre como parâmetros "?"
"app/db.py" = ["S608"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["app"]
