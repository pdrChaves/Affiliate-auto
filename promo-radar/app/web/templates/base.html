<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Promo Radar</title>
<link rel="stylesheet" href="/static/app.css">
<script src="/static/app.js" defer></script>
</head>
<body>
<header><h1>📡 Promo Radar</h1>
{% if settings is defined %}<span class="pill">fonte: {{ settings.catalog_mode }}</span>{% endif %}
<span class="pill">envio: manual (1 clique)</span>
{% if csrf is defined %}<form method="post" action="/logout" style="margin-left:auto"><input type="hidden" name="csrf" value="{{ csrf }}"><button>Sair</button></form>{% endif %}
</header>
<main>{% block body %}{% endblock %}</main>
</body></html>
